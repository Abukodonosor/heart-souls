<!doctype html><html><head><meta charset="utf-8"><title>Sprite validation</title>
<style>body{margin:12px;background:#14091c;color:#ddd;font:13px monospace}canvas{image-rendering:pixelated;border:1px solid #444;margin:4px;background:#2a2a33}.p{color:#6e6}.f{color:#f55}h4{color:#c6f}</style></head>
<body><h3>Darkheart sprite validation (feedback loop)</h3><pre id="o"></pre><div id="v"></div>
<script src="../engine/util.js"></script><script src="../engine/spritegen.js"></script><script src="../engine/sprite.js"></script>
<script>
(async()=>{
 const o=document.getElementById('o');let fails=0,log='';const ok=(c,m)=>{log+=(c?'PASS ':'FAIL ')+m+'\n';if(!c)fails++};
 const port=await dhLoadPortrait('../');const set=genHeroSet(port);
 const px=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
 const P=px(port),F0=px(set.frames[set.anims.idle.frames[0]]);
 // 1. idle frame 0 must equal the source drawing 1:1
 let diff=0,opaque=0;
 for(let y=0;y<GEN.srcH;y++)for(let x=0;x<GEN.srcW;x++){const a=(y*GEN.srcW+x)*4,b=((y+GEN.padY)*SPR.W+x+GEN.padX)*4;
  if(P[a+3])opaque++;for(let k=0;k<4;k++)if(P[a+k]!==F0[b+k]){diff++;break}}
 ok(diff===0,'idle frame 0 is pixel-identical to hero.png ('+diff+' differing pixels of '+GEN.srcW*GEN.srcH+', '+opaque+' opaque)');
 // 2. palette: no frame may contain a colour that is not in the source
 const pal=new Set();for(let i=0;i<P.length;i+=4)if(P[i+3])pal.add(P[i]+','+P[i+1]+','+P[i+2]);
 let bad=0,minPx=1e9,maxPx=0,clipped=0,n=0;
 for(const an in set.anims)for(const fi of set.anims[an].frames){n++;const cnt0=an==='death'?-1:0;const d=px(set.frames[fi]);let cnt=0;
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;cnt++;if(!pal.has(d[i]+','+d[i+1]+','+d[i+2]))bad++}
  for(let x=0;x<SPR.W;x++)for(const y of[0,SPR.H-1])if(d[(y*SPR.W+x)*4+3])clipped++;
  for(let y=0;y<SPR.H;y++)for(const x of[0,SPR.W-1])if(d[(y*SPR.W+x)*4+3])clipped++;
  if(an!=='death'){minPx=Math.min(minPx,cnt);maxPx=Math.max(maxPx,cnt)}}
 ok(bad===0,'all '+n+' frames use only colours from the original ('+bad+' foreign pixels)');
 ok(clipped===0,'no frame touches the canvas edge ('+clipped+' edge pixels)');
 ok(minPx>opaque*0.85&&maxPx<opaque*1.15,'pixel count stays within 15% of the original, death excluded ('+minPx+'..'+maxPx+' vs '+opaque+')');
 // 3. every animation actually moves
 for(const an in set.anims){const a=set.anims[an];const d0=px(set.frames[a.frames[0]]);let moved=false;
  for(const fi of a.frames.slice(1)){const d=px(set.frames[fi]);for(let i=0;i<d.length;i++)if(d[i]!==d0[i]){moved=true;break}if(moved)break}
  ok(moved,an+' animation changes between frames')}
 log+='\n'+(fails?'FAILED '+fails:'ALL PASSED');o.textContent=log;document.title=fails?'FAIL':'PASS';
 // visual: original | idle frame 0 | red = differing pixels
 const S=6,v=document.getElementById('v');v.insertAdjacentHTML('beforeend','<h4>original | idle[0] | diff (red)</h4>');
 const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.style.width=w*S+'px';c.style.height=h*S+'px';v.appendChild(c);return c};
 mk(GEN.srcW,GEN.srcH).getContext('2d').drawImage(port,0,0);
 mk(SPR.W,SPR.H).getContext('2d').drawImage(set.frames[set.anims.idle.frames[0]],0,0);
 const dc=mk(GEN.srcW,GEN.srcH).getContext('2d'),dd=dc.createImageData(GEN.srcW,GEN.srcH);
 for(let y=0;y<GEN.srcH;y++)for(let x=0;x<GEN.srcW;x++){const a=(y*GEN.srcW+x)*4,b=((y+GEN.padY)*SPR.W+x+GEN.padX)*4;let d=false;for(let k=0;k<4;k++)if(P[a+k]!==F0[b+k])d=true;
  dd.data[a]=d?255:60;dd.data[a+1]=d?0:60;dd.data[a+2]=d?0:60;dd.data[a+3]=P[a+3]||d?255:0}
 dc.putImageData(dd,0,0);window.__done=true;
})();
</script></body></html>
