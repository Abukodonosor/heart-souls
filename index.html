<!doctype html>
<html><head><meta charset="utf-8"><title>Dark Heart</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:monospace}
#hud{position:fixed;top:10px;left:14px;color:#fff;font-size:20px;text-shadow:0 0 6px #a0f}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;text-align:center;white-space:pre;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body><div id="hud"></div><div id="msg">DARK HEART\nWASD / arrows to move\nCollect hearts, avoid cubes\nPress any key</div>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0a0612);S.fog=new THREE.Fog(0x0a0612,15,45);
const C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
S.add(new THREE.AmbientLight(0x6644aa,1.2));
const sun=new THREE.PointLight(0xff4455,60,40);sun.position.set(0,8,0);S.add(sun);
const A=20;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(A*2,A*2),new THREE.MeshStandardMaterial({color:0x1a1424}));
floor.rotation.x=-Math.PI/2;S.add(floor);S.add(new THREE.GridHelper(A*2,40,0x6a2a8a,0x2a1a3a));
// hero sprite: key out white background
const img=new Image();img.src='hero.png';
const hero=new THREE.Group();S.add(hero);
img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4)if(d.data[i]>235&&d.data[i+1]>235&&d.data[i+2]>235)d.data[i+3]=0;x.putImageData(d,0,0);
const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,alphaTest:.5}));sp.scale.set(3,3,1);sp.position.y=1.5;hero.add(sp)};
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.7,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.5}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.02;hero.add(shadow);
const rnd=()=>(Math.random()*2-1)*(A-2);
const hearts=[],foes=[];
for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshStandardMaterial({color:0xff2244,emissive:0xaa0022}));m.position.set(rnd(),1,rnd());S.add(m);hearts.push(m)}
function foe(){const m=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshStandardMaterial({color:0x111111,emissive:0x330055}));
do{m.position.set(rnd(),.6,rnd())}while(m.position.distanceTo(hero.position)<10);S.add(m);foes.push(m)}
for(let i=0;i<3;i++)foe();
const keys={};let started=false,score=0,lives=3,over=false,inv=0;
addEventListener('keydown',e=>{keys[e.code]=1;if(!started||over){if(over){location.reload()}started=true;msg.textContent=''}});
addEventListener('keyup',e=>keys[e.code]=0);
const hud=document.getElementById('hud'),msg=document.getElementById('msg');
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(started&&!over){
let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
const l=Math.hypot(dx,dz)||1;hero.position.x=THREE.MathUtils.clamp(hero.position.x+dx/l*8*dt,-A,A);hero.position.z=THREE.MathUtils.clamp(hero.position.z+dz/l*8*dt,-A,A);
hero.children[0]&&(hero.children[0].position.y=1.5+Math.sin(t*(dx||dz?14:3))*.08);
hearts.forEach(h=>{h.rotation.y+=dt*2;h.position.y=1+Math.sin(t*3+h.position.x)*.2;
if(h.position.distanceTo(hero.position)<1.6){score++;h.position.set(rnd(),1,rnd());if(score%4==0)foe()}});
inv-=dt;foes.forEach(f=>{const v=hero.position.clone().sub(f.position);v.y=0;v.normalize().multiplyScalar((2.5+score*.05)*dt);f.position.add(v);f.rotation.y+=dt;
if(inv<=0&&f.position.distanceTo(hero.position)<1.3){lives--;inv=1.5;if(lives<=0){over=true;msg.textContent='GAME OVER\nScore: '+score+'\nPress any key'}}});
hero.visible=inv<=0||Math.floor(t*10)%2==0;
hud.textContent='Hearts: '+score+'   Lives: '+'♥'.repeat(Math.max(lives,0))}
C.position.lerp(new THREE.Vector3(hero.position.x,9,hero.position.z+9),.08);C.lookAt(hero.position.x,1,hero.position.z);
R.render(S,C)}
loop();
</script></body></html>
